  #radio .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#c9903a; padding:8px 12px 4px; display:flex; justify-content:space-between; align-items:center; gap:8px; }

<script>
// Clip starts at the first bass hit and runs a long stretch of the song.
// A plain audio element starts on the click. The Web Audio clock was firing
// this seconds late.
const PHRASE = 80, FADE = 6;
const radioPlay = document.getElementById('radioPlay');
const eqBars = [...document.querySelectorAll('#eq i')];
// Two copies so a later third puff can start over at the first hit.
// Different URLs keep the browser from sharing one playhead.
const voices = [0, 1].map(i => {
  const a = new Audio('assets/opening.mp3?n=' + i);
  a.preload = 'auto';
  a.addEventListener('error', () => { document.getElementById('by').textContent = 'could not load the track'; });
  return a;
});
let voice = 0, fadeTimer = 0, runId = 0;
const flyRadio = { eqBars, voices, get audio(){ return voices[(voice + 1) % 2]; }, playing: false, level: 0, ready: true };
window.flyRadio = flyRadio;
function stopSting(){
  runId++;
  voices.forEach(a => a.pause());
  flyRadio.playing = false;
  flyRadio.level = 0;
  clearInterval(fadeTimer);
  radioPlay.textContent = '▶ play';
}
function playSting(){
  const next = voices[voice];
  voice = (voice + 1) % 2;
  voices[voice].pause();
  try { next.pause(); next.currentTime = 0; } catch (e) {}
  next.volume = 1;
  flyRadio.playing = true;
  flyRadio.level = 1;
  radioPlay.textContent = '❚❚ pause';
  const my = ++runId;
  const started = performance.now();
  clearInterval(fadeTimer);
  fadeTimer = setInterval(() => {
    if (my !== runId) return;
    const e = (performance.now() - started) / 1000;
    if (e >= PHRASE) { stopSting(); return; }
    const fadeStart = PHRASE - FADE;
    const vol = e < fadeStart ? 1 : Math.max(0, 1 - (e - fadeStart) / FADE);
    next.volume = vol;
    flyRadio.level = vol;
  }, 40);
  const pending = next.play();
  if (pending) pending.catch(err => console.error(err));
}
function toggleRadio(){ if (flyRadio.playing) stopSting(); else playSting(); }
radioPlay.onclick = (ev) => { ev.stopPropagation(); toggleRadio(); };
</script>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
const Q = new URLSearchParams(location.search);   // ?demo ?seq=1.8 ?tilt=-0.9 ?cam=x,y,z,tx,ty,tz

// ---------- renderer / scene ----------
// PS1 look: render into a tiny buffer and let the browser upscale it with no smoothing
const PSX_H = 240;
const psxW = () => Math.round(PSX_H * innerWidth / innerHeight), psxH = () => PSX_H;
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.domElement.id = 'gl';
renderer.setPixelRatio(1);
renderer.setSize(psxW(), psxH(), false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = false;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a0c14, 0.022);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.2, 2.6, 0.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.1, 1.9, -4.3);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.03;
controls.minDistance = 2.2; controls.maxDistance = 18;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(psxW(), psxH()), 0.22, 0.5, 0.6);
composer.addPass(bloom);
// 15-bit colour with an ordered dither, like the console's output
const ditherPass = new ShaderPass({
  uniforms: { tDiffuse:{ value:null }, res:{ value:new THREE.Vector2(psxW(), psxH()) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; varying vec2 vUv;
    const mat4 bayer = mat4(0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      ivec2 p = ivec2(mod(floor(vUv*res), 4.0));
      float d = (bayer[p.x][p.y] / 16.0 - 0.5) / 31.0;
      gl_FragColor = vec4(floor((c + d) * 31.0 + 0.5) / 31.0, 1.0);
    }`
});
composer.addPass(ditherPass);
// vertex snapping: positions land on a coarse grid so edges wobble like the PS1's integer rasteriser
function psxify(mat){
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      { vec2 grid = vec2(${(160).toFixed(1)}, ${(120).toFixed(1)});
        gl_Position.xy = floor(gl_Position.xy / gl_Position.w * grid + 0.5) / grid * gl_Position.w; }`);
  };
  mat.needsUpdate = true; return mat;
}

// ---------- the shadow realm outside the den ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { t:{ value:0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float t; varying vec3 vDir;
    vec3 hash3(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return -1.0+2.0*fract(sin(p)*43758.5453123); }
    float noise(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
      return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                     mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                 mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                     mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
    float fbm(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return v; }
    void main(){
      vec3 d = vDir;
      // swirl around the vertical axis, faster near the horizon, like the void behind a 90s boss arena
      float ang = atan(d.z, d.x) + t*0.08 + 2.5*(1.0-abs(d.y));
      vec3 q = vec3(cos(ang)*1.6, d.y*2.2 + t*0.05, sin(ang)*1.6);
      float n1 = fbm(q*1.3 + vec3(0.0, t*0.03, 0.0));
      float n2 = fbm(q*3.1 - vec3(t*0.05, 0.0, t*0.02) + n1*1.8);
      float bands = 0.5 + 0.5*sin(ang*3.0 + n2*6.0 + t*0.4);
      vec3 purple = vec3(0.22,0.05,0.38), violet = vec3(0.45,0.12,0.62), teal = vec3(0.05,0.35,0.40), black = vec3(0.01,0.0,0.03);
      vec3 col = mix(black, purple, smoothstep(-0.2, 0.5, n1));
      col = mix(col, violet, smoothstep(0.25, 0.75, n2) * bands * 0.9);
      col = mix(col, teal, smoothstep(0.55, 0.9, fbm(q*2.0 + vec3(t*0.02))) * 0.6);
      // ghostly drifting eyes/sparks in the dark
      float sp = smoothstep(0.985, 1.0, noise(q*18.0 + t*0.3));
      col += vec3(0.7,0.4,1.0) * sp * 1.5;
      col *= 1.0 - 0.35*smoothstep(-0.2, -0.9, d.y); // darker straight below
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(120, 48, 32), skyMat); scene.add(sky);

// ---------- procedural textures ----------
function woodTexture(){
  const c = document.createElement('canvas'); c.width=c.height=512;
  const g = c.getContext('2d');
  g.fillStyle='#3a1f10'; g.fillRect(0,0,512,512);
  for(let i=0;i<220;i++){
    g.strokeStyle=`rgba(${60+Math.random()*40},${25+Math.random()*20},${10+Math.random()*10},${0.25+Math.random()*0.4})`;
    g.lineWidth=1+Math.random()*3; g.beginPath();
    const y=Math.random()*512; g.moveTo(0,y);
    for(let x=0;x<=512;x+=32) g.lineTo(x, y+Math.sin(x*0.02+i)*4);
    g.stroke();
  }
  for(let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0, i*85, 512, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
function rugTexture(){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  g.fillStyle='#6b1a14'; g.fillRect(0,0,512,512);
  g.strokeStyle='#c9903a'; g.lineWidth=6; g.strokeRect(24,24,464,464); g.strokeRect(60,60,392,392);
  g.fillStyle='#8a2a1c';
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){ if((x+y)%2) continue; g.beginPath(); g.moveTo(90+x*42,90+y*42+21); g.lineTo(90+x*42+21,90+y*42); g.lineTo(90+x*42+42,90+y*42+21); g.lineTo(90+x*42+21,90+y*42+42); g.closePath(); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function softTexture(inner, mid){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,`rgba(255,255,255,${inner})`); r.addColorStop(0.4,`rgba(255,255,255,${mid})`); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const smokeTex = softTexture(.5,.18), glowTex = softTexture(1,.55);

// ---------- the crib: a PS1 living room assembled in Blender from CC0 kits (assets/room.glb) ----------
const ROOM_S = 3;                       // the kit is in metres; the fly is a big fly
const roomGroup = new THREE.Group(); roomGroup.scale.setScalar(ROOM_S); scene.add(roomGroup);
const cjAttach = {};                    // cj_hand / cj_mouth / cj_head empties from Blender
let cjMesh = null, tvScreenMat = null, lavaMat = null;
function pixelTex(t){ if (!t) return t; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.anisotropy = 1; t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; return t; }
new GLTFLoader().load('assets/room.glb', (g) => {
  g.scene.traverse(o => {
    if (o.name.startsWith('cj_') && !o.isMesh) { cjAttach[o.name] = o; return; }
    if (!o.isMesh) return;
    if (o.name === 'cj') cjMesh = o;
    const src = o.material; const n = src.name || '';
    const m = new THREE.MeshLambertMaterial({ color: src.color ? src.color.clone() : 0xffffff, map: pixelTex(src.map), transparent: !!src.transparent && n !== 'cj_hair', opacity: src.opacity ?? 1, side: THREE.FrontSide });
    if (n.startsWith('lavalamp_lamp')) { m.emissive.set(0xc020c0); m.emissiveIntensity = .9; lavaMat = m; }
    if (n.startsWith('tv_metalDark') || n === 'metalDark') { m.emissive.set(0x3060a0); m.emissiveIntensity = .5; tvScreenMat = m; }
    if (n === 'glass' || n.startsWith('rwall') && n.includes('glass')) { m.transparent = true; m.opacity = .18; m.color.set(0x9fd0ff); }
    o.material = psxify(m);
  });
  roomGroup.add(g.scene);
  hangPosters();
  cjBlunt.visible = true;
});

// posters on the back wall (canvas textures, drawn small so they stay crunchy)
function posterTex(lines, bg, fg, w=96, h=144){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,w,h); g.strokeStyle = fg; g.lineWidth = 2; g.strokeRect(2,2,w-4,h-4);
  g.fillStyle = fg; g.font = 'bold 15px Impact, "Arial Black", sans-serif'; g.textAlign = 'center';
  lines.forEach((l,i) => { g.font = `bold ${l.length > 6 ? 17 : 24}px Impact, "Arial Black", sans-serif`; g.fillText(l, w/2, 40 + i*34); });   // long words drop a size so they fit the poster
  const t = new THREE.CanvasTexture(c); return pixelTex(t);
}
function hangPosters(){
  // back wall is at kit y=+2.5 -> three z = -2.5*ROOM_S; walls face -z
  const specs = [
    [ 0.2, [ 'TEAM', 'SESH', 'DEADBOYS' ], '#0a0a0a', '#e8e8e8'],
    [ 1.4, [ 'EDDY', 'BAKER', '☠' ], '#101010', '#c8c8c8'],
  ];
  for (const [x, lines, bg, fg] of specs) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), psxify(new THREE.MeshLambertMaterial({ map: posterTex(lines, bg, fg) })));
    p.position.set(x*ROOM_S, 1.5*ROOM_S, -2.5*ROOM_S + .1); scene.add(p);
  }
  // a poster of the lowrider on the left wall, facing +x
  const lp = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.2), psxify(new THREE.MeshLambertMaterial({ map: posterTex(['SESH', 'HOLD'], '#0a0a0a', '#e0e0e0', 144, 96) })));
  lp.rotation.y = Math.PI/2; lp.position.set(-3*ROOM_S + .1, 1.8*ROOM_S, 1.2*ROOM_S); scene.add(lp);
  const dg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), psxify(new THREE.MeshLambertMaterial({ map: posterTex(['DEER', 'GOD', '🦌'], '#0a0a0a', '#d8d8d8') })));
  dg.rotation.y = Math.PI/2; dg.position.set(-3*ROOM_S + .1, 1.75*ROOM_S, 0.1*ROOM_S); scene.add(dg);
  // the album still on the back wall, facing the camera
  new THREE.TextureLoader().load('assets/poster_yt.png', (t) => {
    const yp = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.46), psxify(new THREE.MeshLambertMaterial({ map: pixelTex(t) })));
    yp.position.set(-2.5*ROOM_S, 1.22*ROOM_S, -2.5*ROOM_S + .1); scene.add(yp);   // back wall, left of the bookshelf
    const frame = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.66), psxify(new THREE.MeshLambertMaterial({ color: 0xe8e8e8 })));
    frame.position.copy(yp.position); frame.position.z -= .02; scene.add(frame);
  });
}

// lights: a warm overhead, the lava lamp, the TV, the void leaking in through the windows
scene.add(new THREE.AmbientLight(0x7a5a8a, 2.2));
scene.add(new THREE.HemisphereLight(0x9a6ac0, 0x2a1418, 1.6));
const ceilLight = new THREE.PointLight(0xffc890, 160, 40, 2); ceilLight.position.set(0, 7.2, -3); scene.add(ceilLight);
const couchLight = new THREE.PointLight(0xffd0a0, 40, 14, 2); couchLight.position.set(-1.5, 4.0, -1.5); scene.add(couchLight);
const lavaLight = new THREE.PointLight(0xd040e0, 25, 12, 2); lavaLight.position.set(-2.55*ROOM_S, 2.2, -1.2*ROOM_S); scene.add(lavaLight);
const tvLight = new THREE.PointLight(0x4080ff, 12, 9, 2); tvLight.position.set(-2.2*ROOM_S, 1.9, 0.6*ROOM_S); scene.add(tvLight);

    if (h < .02) h = 0;
    nHeat[i]=h; if (h > .6) firing++;
    tmpC.setHSL(.78 - h*.7, 1, .12 + h*.55);
    nCol[i*3]=tmpC.r; nCol[i*3+1]=tmpC.g; nCol[i*3+2]=tmpC.b;
    if (nFired[i] && nRad[i] > .55 && Math.random() < glow*.015){   // outer-shell spikes spit fire out of the fly's head
      v3.set(nPos[i*3],nPos[i*3+1],nPos[i*3+2]).normalize();
      const sp = .5 + torch*.8 + Math.random()*.4;
      emit(fire, headWorld.x+v3.x*.3, headWorld.y+v3.y*.3, headWorld.z+v3.z*.3, v3.x*sp+(Math.random()-.5)*.2, Math.abs(v3.y)*sp+.6, v3.z*sp+(Math.random()-.5)*.2, .3+Math.random()*.3, 1,.75,.2);
    }
  }
  nGeo.attributes.color.needsUpdate = true;
  for (let k=0;k<E;k++){ const h=Math.max(nHeat[eIdx[k*2]], nHeat[eIdx[k*2+1]]); tmpC.setHSL(.78-h*.7,1,.06+h*.5); eCol.set([tmpC.r,tmpC.g,tmpC.b,tmpC.r,tmpC.g,tmpC.b], k*6); }
  eGeo.attributes.color.needsUpdate = true;
  neurons.material.size = .05 + glow*.05;
  brain.rotation.y = t*.35; brain.rotation.x = Math.sin(t*.4)*.2;
  brainStat.textContent = `${firing} synapses firing`;
  stepBrainSmoke(dt, t);
  bloom.strength = .22 + glow*.12 + torch*.1;

  // --- smoke: a small wisp curling up from the fly's mouth, a little more right after a puff ---
  const wisp = .1 + glow*.6 + torch*1.5;
  for (let k=0;k<wisp;k++)
    emit(smoke, mouthWorld.x+(Math.random()-.5)*.06, mouthWorld.y+.02, mouthWorld.z+(Math.random()-.5)*.06, (Math.random()-.5)*.12 + camRight.x*.3, .25+Math.random()*.2, (Math.random()-.5)*.12 + camRight.z*.3, 1.6+Math.random()*1.4, .85,.8,.75);
  bowl.getWorldPosition(bowlWorld);
  if (Math.random() < .12 + torch*.4)
    emit(smoke, bowlWorld.x, bowlWorld.y+.06, bowlWorld.z, (Math.random()-.5)*.08 + camRight.x*.3, .22+Math.random()*.15, (Math.random()-.5)*.08 + camRight.z*.3, 1.2+Math.random(), .8,.7,.65);
  fireworkTimer -= dt;
  if (glow > .5 && fireworkTimer <= 0){ fireworks(false); fireworkTimer = 2.5 + (1-glow)*4; }

  step(smoke, dt, (i)=>{ smoke.vel[i*3]+=Math.sin(t*1.1+i)*dt*.12; smoke.vel[i*3+2]+=Math.cos(t*.9+i*1.7)*dt*.12; smoke.vel[i*3+1]*=1-dt*.2; }, (i,l)=> (1-l)*Math.min(1,l*4)*.7);
  step(fire, dt, (i)=>{ fire.vel[i*3+1]+=dt*1.5; }, (i,l)=>{ tmpC.setHSL(.12-l*.12, 1, .7-l*.5); fire.base[i*3]=tmpC.r; fire.base[i*3+1]=tmpC.g; fire.base[i*3+2]=tmpC.b; return 1; });
  step(sparks, dt, (i)=>{ sparks.vel[i*3+1]-=dt*3.2; for(let a=0;a<3;a++) sparks.vel[i*3+a]*=1-dt*1.2; }, (i,l)=> Math.sqrt(1-l)*(l>.6 ? (Math.sin(t*40+i)>0?1:.2) : 1));
  smoke.mat.opacity = .3 + glow*.1; smoke.mat.size = .5 + glow*.3;

  // the crib breathes: TV static flicker, lava lamp slow pulse, CJ takes a hit now and then
  tvLight.intensity = 10 + Math.random()*6;
  if (tvScreenMat) tvScreenMat.emissiveIntensity = .35 + Math.random()*.35;
  lavaLight.intensity = 22 + Math.sin(t*.7)*6; if (lavaMat) lavaMat.emissiveIntensity = .7 + Math.sin(t*.7)*.3;
  if (cjAttach.cj_hand && cjAttach.cj_mouth) {
    cjAttach.cj_hand.getWorldPosition(cjHandW); cjAttach.cj_mouth.getWorldPosition(cjMouthW);
    cjBlunt.position.copy(cjHandW); cjBlunt.lookAt(cjMouthW); cjBlunt.rotateY(Math.PI/2); // x axis points away from the mouth
    cjBlunt.rotateY(Math.PI);
    cjBlunt.userData.ember.getWorldPosition(cjEmberW);
    const cjHit = Math.max(0, Math.sin(t*.45)) ** 6 * .4 + cjDrag;   // a lazy idle rhythm, plus his turn in the sequence
    cjBlunt.userData.light.intensity = .6 + cjHit*4 + torch*3;
    if (Math.random() < .15 + cjHit*.7) emit(smoke, cjEmberW.x, cjEmberW.y+.03, cjEmberW.z, (Math.random()-.5)*.06, .18+Math.random()*.12, (Math.random()-.5)*.06, 1.4+Math.random(), .8,.72,.68);
    const exhale = Math.max(0, Math.sin(t*.45 - 1.2)) ** 8 * .8 + cjExhale*7;
    for (let k=0;k<exhale;k++) emit(smoke, cjMouthW.x, cjMouthW.y, cjMouthW.z, (Math.random()-.5)*.1, .22+Math.random()*.15, (Math.random()-.5)*.1 - .12, 1.8+Math.random()*1.2, .85,.8,.78);
    if (cjMesh) cjMesh.rotation.x = cjMesh.userData.rx ?? (cjMesh.userData.rx = cjMesh.rotation.x), cjMesh.rotation.x = cjMesh.userData.rx + Math.sin(t*1.1)*.012 + listen*.03*Math.sin(t*9) + cjDrag*.06 - cjExhale*.05;
  }

  controls.update();
  composer.render();
  brainRenderer.render(brainScene, brainCam);
}
animate();
if (location.search.includes("demo")) { dose = doseTarget = 1; torch = 1; showPhrase(PHRASES[0]); for (let k=0;k<3;k++) btn.click(); }

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(psxW(), psxH(), false); composer.setSize(psxW(), psxH()); ditherPass.uniforms.res.value.set(psxW(), psxH());
  sizeBrain();
});
</script>
</body>
